name: Build Android APK

on:
  # Lehetővé teszi, hogy kézzel indítsd el a futtatást a GitHub "Actions" fülén
  workflow_dispatch:
  
  # Opcionális: Automatikusan lefut, ha a 'main' ágra (branch) push-olsz
  push:
    branches:
      - main

jobs:
  build:
    # A futtatási környezet (egy Linux gép)
    runs-on: ubuntu-latest

    steps:
      # 1. lépés: Letölti a kódodat a repository-ból
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. lépés: Beállítja a Java Development Kit-et (JDK 17)
      # A te projekted (a build.gradle.kts alapján) JDK 17-et igényel
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. lépés: Gyorsítótár (cache) beállítása a Gradle-höz
      # Ez meggyorsítja a jövőbeli buildeket, mert nem kell mindent letölteni
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 4. lépés: Futtathatóvá teszi a Gradle wrapper scriptet
      # (Gyakori hiba CI/CD-ben, hogy ez elmarad)
      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      # 5. lépés: Lefordítja az alkalmazást (debug verzió)
      # Ez hozza létre az APK fájlt. A 'debug' verzióhoz nem kellenek aláíró kulcsok.
      - name: Build with Gradle
        run: ./gradlew assembleDebug

      # 6. lépés: Feltölti az elkészült APK fájlt "artifact"-ként
      # A futás után le tudod majd tölteni.
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: relixor-debug-apk  # Így fog hívni a letölthető csomagot
          path: app/build/outputs/apk/debug/app-debug.apk # Ez az APK fájl pontos helye
